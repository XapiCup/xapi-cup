<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournoi en direct — Xapi Cup</title>
  <link rel="stylesheet" href="css/style.css?v=20260814l" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">⚽</span>
        <div class="logo-text">
          <span class="logo-title">XAPI <strong>CUP</strong></span>
          <span class="logo-sub">Tournoi en direct</span>
        </div>
      </a>
      <nav class="main-nav">
        <a href="index.html" class="nav-link">Accueil</a>
        <a href="viewer.html" class="nav-link active">Tournoi en direct</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- Sélecteur de tournoi (si plusieurs publics) -->
    <section class="container" id="tournament-selector-section" style="padding-top: 30px; display:none;">
      <div class="tournament-selector" id="tournament-selector"></div>
    </section>

    <!-- Bandeau live -->
    <section class="container" id="viewer-header" style="padding-top: 30px;">
      <div class="flex-between" style="flex-wrap: wrap; gap: 12px;">
        <div>
          <h1 style="margin: 0;" id="page-title">Xapi Cup</h1>
          <p class="muted" style="margin: 0;" id="page-subtitle">Suivez les poules et les phases finales en direct.</p>
        </div>
        <div id="live-status"></div>
      </div>
    </section>

    <!-- TOURNOI EN DIRECT (onglet unique) -->
    <section class="container">
      <div class="tabs">
        <button class="tab active" data-viewer-subtab="poules">⚽ Poules &amp; classements</button>
        <button class="tab" data-viewer-subtab="knockout">🏆 Phase finale</button>
        <button class="tab" data-viewer-subtab="stats">🎯 Buteurs &amp; MVP</button>
      </div>
      <div id="viewer-subtab-poules">
        <div id="poules-container"></div>
      </div>
      <div id="viewer-subtab-knockout" style="display:none;">
        <div class="tabs" style="margin-bottom: 0;">
          <button class="tab active" data-bracket-tab="gold">🥇 Tableau Or</button>
          <button class="tab" data-bracket-tab="silver">🥈 Consolante</button>
        </div>
        <div id="knockout-container" style="margin-top: 20px;"></div>
      </div>
      <div id="viewer-subtab-stats" style="display:none;">
        <div id="stats-container"></div>
      </div>
    </section>
  </main>

  <!-- Bouton flottant pour afficher/masquer le feed live -->
  <button class="live-feed-toggle" id="live-feed-toggle" title="Afficher/masquer l'actu du tournoi" aria-label="Feed live">
    🔔
    <span class="live-feed-toggle-badge" id="live-feed-toggle-badge" style="display:none;">0</span>
  </button>

  <!-- Feed live (collatéral fixe) -->
  <aside class="live-feed-aside" id="live-feed-aside">
    <div class="live-feed-header">
      <span class="live-pill">🔴 EN DIRECT</span>
      <h3>Actu du tournoi</h3>
      <button class="live-feed-close" id="live-feed-close" aria-label="Fermer">×</button>
    </div>
    <div id="live-feed" class="live-feed-list"></div>
  </aside>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> Xapi Cup — Club de foot d'Hasparren</p>
      <p class="muted">Page publique · Mises à jour en direct</p>
    </div>
  </footer>

  <script type="module" src="js/viewer.js?v=20260814l"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
